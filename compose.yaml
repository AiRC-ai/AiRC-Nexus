name: ${NEXUS_COMPOSE_PROJECT:-airc-nexus-local}
services:
  database:
    image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_DB: nexus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [nexus_data:/var/lib/postgresql]
    networks: [nexus]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d nexus]
      interval: 2s
      timeout: 2s
      retries: 30
  app:
    build: .
    image: ${NEXUS_COMPOSE_PROJECT:-airc-nexus-local}:0.3.0
    depends_on:
      database: { condition: service_healthy }
    environment:
      NEXUS_DATABASE_URL_FILE: /run/secrets/app_url
      NEXUS_PORT: ${NEXUS_HTTP_PORT:-4319}
      NEXUS_LISTEN_HOST: 0.0.0.0
    secrets: [app_url]
    ports: ['127.0.0.1:${NEXUS_HTTP_PORT:-4319}:${NEXUS_HTTP_PORT:-4319}']
    networks: [frontend, nexus]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.75
    mem_limit: 512m
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:'+process.env.NEXUS_PORT+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
  worker:
    image: ${NEXUS_COMPOSE_PROJECT:-airc-nexus-local}:0.3.0
    command: [node, dist/apps/worker/main.js]
    depends_on:
      database: { condition: service_healthy }
    environment:
      NEXUS_WORKER_DATABASE_URL_FILE: /run/secrets/worker_url
    secrets: [worker_url]
    networks: [nexus]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 384m
  init:
    profiles: [tools]
    image: ${NEXUS_COMPOSE_PROJECT:-airc-nexus-local}:0.3.0
    command: [node, dist/scripts/compose-init.js]
    user: '${NEXUS_OPERATOR_UID:-1000}:${NEXUS_OPERATOR_GID:-1000}'
    depends_on:
      database: { condition: service_healthy }
    secrets: [postgres_password, app_password, worker_password]
    volumes: [./.nexus/compose/operator:/app/.nexus]
    networks: [nexus]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
secrets:
  postgres_password: { file: ./.nexus/compose/secrets/postgres-password }
  app_password: { file: ./.nexus/compose/secrets/app-password }
  worker_password: { file: ./.nexus/compose/secrets/worker-password }
  app_url: { file: ./.nexus/compose/secrets/app-url }
  worker_url: { file: ./.nexus/compose/secrets/worker-url }
volumes:
  nexus_data:
networks:
  frontend:
  nexus:
    internal: true
